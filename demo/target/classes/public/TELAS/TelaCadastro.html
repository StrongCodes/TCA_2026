<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <title>spartacus.com</title>
    <link rel="icon" href="./imagens/Spartacus_Logo.png" type="./imagens/Spartacus_Logo.png">
    <link rel="stylesheet" href="/STYLES/style_TelaCadastro.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="DivPrincipal" class="DivPrincipal">
        <div id="DivInicial" class="DivInicial" style="background-image: url('/imagens/ImagemInicialCadastro.png');">
            <div id="DivCadastro" class="DivCadastro">
            
                <div id="DivLogoCadastro" class="DivLogoCadastro" style="background-image: url('/imagens/LogoLogin.png');"></div>
            
                <p id="DivTituloCadastro" class="DivTituloCadastro">SPARTACUS ID</p>
            
                <p id="ParagrafoRecepçao" class="ParagrafoRecepçao">
                    <strong>Crie sua Conta</strong><br>
                            
                    Entre para o universo automotivo
                </p>

                <div id="DivInputsCadastro" class="DivInputsCadastro">
                    <div id="DivNomeCadastro" class="DivNomeCadastro">
                        <input 
                            type="text" 
                            id="InputTextoNomeCadastro" 
                            autocomplete="name"
                        >
                        <p id="ParagrafoNome" class="ParagrafoNome">Nome</p>
                    </div>
                
                    <div id="DivEmailCadastro" class="DivEmailCadastro">
                        <input 
                            type="email" 
                            id="InputTextoEmailCadastro"
                            autocomplete="email"
                        >
                        <p id="ParagrafoEmail" class="ParagrafoEmail">Email</p>
                    </div>
                
                    <div id="DivSenhaCadastro" class="DivSenhaCadastro">
                        <input 
                            type="password" 
                            id="InputTextoSenhaCadastro"
                            autocomplete="new-password"
                        >
                        <p id="ParagrafoSenha" class="ParagrafoSenha">Senha</p>
                    </div>
                
                    <div id="DivCpfCadastro" class="DivCpfCadastro">
                        <input 
                            type="text" 
                            id="InputTextoCpfCadastro"
                            name="cpf"
                            autocomplete="off"
                        >
                        <p id="ParagrafoCpf" class="ParagrafoCpf">CPF</p>
                    </div>
                </div>
            
                <div id="DivBotaoCadastrarCadastro" class="DivBotaoCadastrarCadastro">
                    Cadastrar-se
                </div>
            </div>
        </div>
    </div>
    <script src="/SCRIPTS/script_TelaCadastro.js" defer></script>
</body>
</html>
