<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <title>spartacus.com</title>
    <link rel="icon" href="./imagens/Spartacus_Logo.png" type="./imagens/Spartacus_Logo.png">
    <link rel="stylesheet" href="/STYLES/style_TelaCompra.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="DivPrincipal" class="DivPrincipal">
        <div id="DivCabeçario" class="DivCabeçario">
            <img id="DivLogoCabeçario" class="DivLogoCabeçario" src="/imagens/Spartacus_Logo.png">
            <p id="ParagrafoTituloCabeçario" class="ParagrafoTituloCabeçario"">Spartacus</p>
            <div id="DivBotaoMenu" class="DivBotaoMenu" onclick="Menu()">
                <div id="DivDetalhe_1" class="DivDetalhe_1"></div>
                <div id="DivDetalhe_2" class="DivDetalhe_2"></div>
                <div id="DivDetalhe_3" class="DivDetalhe_3"></div>
            </div>
            <div id="DivUsuario" class="DivUsuario" style="background-image: url('/imagens/Usuario.png');" onclick="AbreLogin()"></div>
            <div id="DivMenu" class="DivMenu">
                <div id="DivMenuCabeçario" class="DivMenuCabeçario">MENU</div>
                <div id="DivMenuOfertas" class="DivMenuOpçao">Ofertas</div>
                <div id="DivMenuComprar" class="DivMenuOpçao">Comprar</div>
                <div id="DivMenuLocar" class="DivMenuOpçao">Locar</div>
                <div id="DivMenuAjuda" class="DivMenuOpçao">Ajuda</div>
            </div>
        </div>
        <div id="DivDetalhesImagem" class="DivDetalhesImagem"></div>
        <div id="DivOpçoesDetalhes" class="DivOpçoesDetalhes">
            <div id="DivPrimaria" class="DivPrimaria">
                <p id="ParagrafoModelo" class="ParagrafoModelo"></p>
                <p id="ParagrafoAnoeCor" class="ParagrafoAnoeCor"></p>
                <p id="ParagrafoPreço" class="ParagrafoPreço"></p>
            </div>
            <div id="DivSeparaçao" class="DivSeparaçao"></div>
            <div id="DivInformaçoes" class="DivInformaçoes">
                <p id="ParagrafoEspecificaçoes" class="ParagrafoEspecificaçoes">ESPECIFICAÇÕES</p>
                <div id="DivCombustivel">
                    <p id="ParagrafoCombustivel" class="ParagrafoCombustivel">Combustivel</p>
                    <p id="ParagrafoValorCombustivel" class="ParagrafoValorCombustivel"></p>
                </div>
                <div id="DivPotencia">
                    <p id="ParagrafoPotencia" class="ParagrafoPotencia">Potência</p>
                    <p id="ParagrafoValorPotencia" class="ParagrafoValorPotencia"></p>
                </div>
                
                <div id="DivCilindros">
                    <p id="ParagrafoCilindros" class="ParagrafoCilindros">Cilindros</p>
                    <p id="ParagrafoValorCilindros" class="ParagrafoValorCilindros"></p>
                </div>
                
                <div id="DivAvaliacao">
                    <p id="ParagrafoAvaliacao" class="ParagrafoAvaliacao">Avaliação</p>
                    <p id="ParagrafoValorAvaliacao" class="ParagrafoValorAvaliacao"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="/SCRIPTS/script_ControlaElementosComplexos.js" defer></script>
    <script src="/SCRIPTS/script_ControlaElementosSimples.js" defer></script>
    <script src="/SCRIPTS/script_EntradaDeDados.js" defer></script>
</body>
</html>
